# File browser.
#
# Before starting, set YCY_FS_ACCOUNT in the shell or an untracked .env
# file, then run: docker compose -f docker-compose.fs.yml up -d
# YCY_FS_ACCOUNT uses the format username:password. The account is supplied
# as a container argument, so keep the Compose project and Docker host private.
# Chunked uploads are disabled by default. Set YCY_FS_CHUNKED_UPLOAD=1 for files
# larger than 20 MiB; YCY_FS_UPLOAD_CHUNK_SIZE_MIB accepts 4-16 and defaults to 8.
services:
  fs:
    # Set YCY_VERSION to a released image tag to pin upgrades; omitting it uses
    # the latest image tag. The image entrypoint is already "ycy".
    image: ghcr.io/hackycy/hackycy-cli:${YCY_VERSION:-latest}
    # Docker owns restart behavior; "unless-stopped" also brings the server
    # back after a host reboot.
    restart: unless-stopped
    # Serves the mounted directory through the file browser. Management is
    # enabled for uploads, remote downloads, archive extraction, and file
    # operations. Safe HTML prevents served HTML and XHTML from executing.
    command: [fs, --address, 0.0.0.0, --port, '1204', --manage, --safe-html, --account, '${YCY_FS_ACCOUNT:?required}', /data]
    environment:
      # Keep durable login sessions outside the browsed directory. This named
      # volume is sensitive because valid session records live there.
      YCY_FS_SESSION_DIR: /sessions
      # YCY_FS_SESSION_IDLE_DAYS: 7
      YCY_FS_CHUNKED_UPLOAD: '${YCY_FS_CHUNKED_UPLOAD:-0}'
      YCY_FS_UPLOAD_CHUNK_SIZE_MIB: '${YCY_FS_UPLOAD_CHUNK_SIZE_MIB:-8}'
    volumes:
      # Set YCY_FS_DIRECTORY to an absolute host path for an existing
      # directory. The default creates ./fs-data beside this file.
      # All file-management operations affect this host directory permanently.
      - '${YCY_FS_DIRECTORY:-./fs-data}:/data'
      - fs-sessions:/sessions
    ports:
      # The browser is available at http://localhost:1204 by default. Set
      # YCY_FS_PORT to select another host port. Use a reverse proxy with
      # HTTPS before exposing this service outside a trusted network.
      - '${YCY_FS_PORT:-1204}:1204/tcp'
volumes:
  # Retain this volume to preserve valid file-browser sessions across restarts.
  fs-sessions:
