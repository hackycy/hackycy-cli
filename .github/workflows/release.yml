name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == tag ]] || { echo 'Run this workflow from a release tag.' >&2; exit 1; }
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "tag must be a stable vX.Y.Z version: $TAG" >&2
            exit 1
          }
          version="$(tr -d '\r\n' < cmd/ycy/VERSION)"
          [[ "$version" == "${TAG#v}" ]] || {
            echo "cmd/ycy/VERSION ($version) does not match tag $TAG" >&2
            exit 1
          }
          [[ "$(git cat-file -t "$TAG" 2>/dev/null || true)" == tag ]] || {
            echo "tag is not annotated: $TAG" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install 7-Zip build dependency
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends p7zip-full

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build release assets
        run: make release-candidate

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/${{ steps.release.outputs.version }}/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
