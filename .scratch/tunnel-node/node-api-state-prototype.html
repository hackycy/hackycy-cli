<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node 管理 API 状态草模</title>
  <style>
    :root{font:15px/1.5 system-ui,-apple-system,sans-serif;color:#20303d;background:#f4f7f8}*{box-sizing:border-box}body{margin:0 auto;padding:32px 20px;max-width:1080px}h1{font-size:26px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#60737c}.tag{font-size:12px;color:#126968;font-weight:700;letter-spacing:.05em}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #dbe5e8;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #1232}.wide{grid-column:1/-1}dl{display:grid;grid-template-columns:148px 1fr;gap:8px 12px;margin:0}dt{color:#60737c}dd{margin:0;font-weight:600;overflow-wrap:anywhere}.buttons,.tabs{display:flex;gap:8px;flex-wrap:wrap}button{background:white;border:1px solid #c5d3d8;border-radius:8px;padding:8px 11px;cursor:pointer;color:inherit}button:hover{border-color:#176f70}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#126968;color:white;border-color:#126968}.danger{color:#a33d2f;border-color:#d9afa8}.active{background:#e2f4f1;border-color:#126968}pre{white-space:pre-wrap;word-break:break-word;background:#14252e;color:#e1f3ef;border-radius:9px;padding:14px;min-height:84px;margin:0}.note{background:#ecf6f4;padding:10px;border-radius:8px;margin-top:12px}@media(max-width:720px){.layout{grid-template-columns:1fr}.wide{grid-column:auto}dl{grid-template-columns:120px 1fr}}
  </style>
</head>
<body>
  <span class="tag">可丢弃草模 · 纯内存 · 不调用真实 API</span>
  <h1>Node 管理 API 的返回与后续状态</h1>
  <p class="muted">要验证的问题：一次 HTTP 请求返回“已保存”后，页面能否继续区分 Node 管理连接、FRPS 实际运行、配置应用，以及 Client 的 FRPC 登录？点击流程或任意按钮观察响应和状态。</p>
  <section class="card"><h2>引导场景</h2><div class="tabs" id="tabs"></div><p id="scenario-note" class="muted"></p><div class="buttons" id="steps"></div></section>
  <div class="layout">
    <section class="card"><h2>Node 公共摘要</h2><dl id="public-state"></dl></section>
    <section class="card"><h2>管理员详情</h2><dl id="admin-state"></dl></section>
    <section class="card"><h2>Client 详情</h2><dl id="client-state"></dl></section>
    <section class="card"><h2>任意操作</h2><div class="buttons" id="free-play"></div><p class="note">这里的“可选择”只作列表提示。提交切换时，Server 会重新预检。</p></section>
    <section class="card wide"><h2>最近一次 HTTP 结果与页面提示</h2><pre id="result"></pre></section>
  </div>
  <script>
    // 纯状态机：可把 action、结果和投影逻辑移入正式实现；DOM 只是展示外壳。
    function initialState(){return {node:{exists:false,name:'Hong Kong 01',claimPreview:false,claimed:false,management:'unknown',frps:'unknown',desired:0,applied:0,removing:false,offline:false,token:'idle'},client:{control:'online',node:'local',pending:null,applied:'local',frpc:'connected'},result:'选择一个操作。'}}
    function project(s){const n=s.node,c=s.client;return {public:{名称:n.exists?n.name:'尚未加入',管理连通性:n.exists?n.management:'—',FRPS:n.exists?n.frps:'—',可选择:selectable(n)?'是':'否',生命周期:n.removing?'待移除':n.claimed?'活动':'未认领'},admin:{指纹预览:n.claimPreview?'SHA256:示例指纹，需与 Node 本机核对':'无',归属:n.claimed?'固定本 Controller':'未绑定',期望版本:n.desired,已应用版本:n.applied,配置收敛:n.desired===n.applied&&n.applied>0?'已应用':n.desired>n.applied?'待应用 / 故障':'未配置',轮换:n.token},client:{控制连接:c.control,当前归属:c.node,待切换:c.pending||'无',已应用目标:c.applied,'FRPC 登录':c.frpc}}}
    function selectable(n){return n.exists&&!n.removing&&n.management==='可达'&&n.frps==='运行'&&n.applied>0}
    function reduce(old,action){const s=structuredClone(old),n=s.node,c=s.client;const respond=(method,path,status,message)=>{s.result=method+' '+path+' → '+status+'\n'+message;return s};switch(action){
      case 'preview':n.claimPreview=true;return respond('POST','/api/nodes/claim-previews','200','只返回指纹；Node 仍未绑定。');
      case 'claim':if(!n.claimPreview)return respond('POST','/api/nodes','409','请先预览并核对完整指纹。');n.claimed=true;n.exists=true;n.management='可达';n.frps='停止';return respond('POST','/api/nodes','201','Node 已绑定，仍未配置 FRPS，不可作为切换目标。');
      case 'save':if(!n.claimed)return respond('PUT','/api/nodes/{id}/desired','409','Node 尚未认领。');n.desired++;return respond('PUT','/api/nodes/{id}/desired','200','期望配置已保存；端口池立即成为 Server 资源范围，远端仍待应用。');
      case 'applied':if(!n.claimed)return respond('GET','/api/nodes/{id}/management','404','Node 尚未加入。');if(n.offline)return respond('GET','/api/nodes/{id}/management','200','Node 离线，无法确认新版本已应用。');n.applied=n.desired;n.frps='运行';return respond('GET','/api/nodes/{id}/management','200','收到 Node 持久应用结果；FRPS 新鲜观察为运行。');
      case 'offline':n.offline=true;n.management='不可达';n.frps='未知';return respond('GET','/api/nodes/{id}','200','管理不可达；上次运行不能作为当前 FRPS 状态。');
      case 'online':n.offline=false;n.management='可达';n.frps=n.applied>0?'运行':'停止';return respond('GET','/api/nodes/{id}','200','管理连接恢复；重新读取已应用版本和 FRPS 观察。');
      case 'switch':if(!selectable(n))return respond('PUT','/api/clients/{id}/node-assignment','409 NODE_TARGET_UNAVAILABLE','归属未变。');if(c.control==='offline'){c.pending='node-hk';return respond('PUT','/api/clients/{id}/node-assignment','202','仅保存待切换；旧归属和资源保持。')}c.node='node-hk';c.pending=null;c.frpc='等待登录';return respond('PUT','/api/clients/{id}/node-assignment','200','归属已提交到新 Node；FRPC 是否登录另行观察。');
      case 'client-offline':c.control='offline';return respond('GET','/api/clients/{id}','200','Client 控制断开；旧 FRPC 可能仍在运行。');
      case 'client-online':c.control='online';if(c.pending&&selectable(n)){c.node=c.pending;c.pending=null;c.frpc='等待登录'}return respond('GET','/api/clients/{id}','200',c.pending?'目标仍不可用，待切换保留。':'认证 welcome 后下发当前完整目标。');
      case 'frpc-fail':c.applied=c.node;c.frpc='登录失败';return respond('GET','/api/clients/{id}','200','Client 已应用新目标但 FRPC 登录失败；不会自动回旧 Node。');
      case 'remove':if(c.node==='node-hk'||c.pending==='node-hk')return respond('DELETE','/api/nodes/{id}','409 NODE_HAS_CLIENTS','先转移当前和待切换 Client。');n.removing=true;n.desired++;return respond('DELETE','/api/nodes/{id}','202','持久停用意图已保存；等待远端确认。');
      case 'stopped':if(!n.removing||n.offline)return respond('GET','/api/nodes/{id}/management','200','尚无可信的持久停用确认。');n.exists=false;n.frps='停止';return respond('GET','/api/nodes','200','Node 已确认停用并从 Server 活动列表移除，Node 本机仍绑定。');
      case 'forget':if(c.node==='node-hk'||c.pending==='node-hk')return respond('POST','/api/nodes/{id}/force-forget','409 NODE_HAS_CLIENTS','先清理 Client 归属。');if(!n.removing&&!n.offline)return respond('POST','/api/nodes/{id}/force-forget','409','可管理的活动 Node 请先正常移除。');n.exists=false;return respond('POST','/api/nodes/{id}/force-forget','204','只删除 Server 记录；远端 FRPS 可能仍运行，Node 本机仍绑定。');
    }return s}
    const actions={preview:'预览指纹',claim:'确认认领',save:'保存 FRPS 配置',applied:'模拟远端应用确认',offline:'模拟 Node 离线',online:'模拟 Node 恢复',switch:'选择该 Node', 'client-offline':'模拟 Client 离线','client-online':'模拟 Client 重连','frpc-fail':'模拟 FRPC 登录失败',remove:'正常移除',stopped:'模拟停用确认',forget:'强制遗忘'};
    const scenarios=[
      {name:'认领与启动',note:'预览和认领分开；Server 保存配置后还要等待远端应用。',steps:['preview','claim','save','applied']},
      {name:'离线保存配置',note:'Node 离线时保存的期望版本已生效于 Server，但 FRPS 运行未知。',steps:['preview','claim','save','applied','offline','save','online','applied']},
      {name:'切换后登录失败',note:'归属提交后 FRPC 登录失败，不自动回到旧 Node。',steps:['preview','claim','save','applied','switch','frpc-fail']},
      {name:'待切换',note:'Client 离线时仅记录目标；重连后重新预检。',steps:['preview','claim','save','applied','client-offline','switch','client-online']},
      {name:'移除与遗忘',note:'普通移除等待持久停用确认；离线时可在明确提示后强制遗忘。',steps:['preview','claim','save','applied','offline','remove','forget']}
    ];
    let state=initialState(),scenarioIndex=0,stepIndex=0;
    const escape=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function rows(target,values){document.getElementById(target).innerHTML=Object.entries(values).map(([k,v])=>'<dt>'+escape(k)+'</dt><dd>'+escape(v)+'</dd>').join('')}
    function render(){const p=project(state);rows('public-state',p.public);rows('admin-state',p.admin);rows('client-state',p.client);document.getElementById('result').textContent=state.result;document.getElementById('tabs').innerHTML=scenarios.map((x,i)=>'<button class="'+(i===scenarioIndex?'active':'')+'" data-tab="'+i+'">'+escape(x.name)+'</button>').join('');document.getElementById('scenario-note').textContent=scenarios[scenarioIndex].note;document.getElementById('steps').innerHTML=scenarios[scenarioIndex].steps.map((x,i)=>'<button '+(i===stepIndex?'class="primary"':'disabled')+' data-step="'+i+'">'+(i+1)+'. '+escape(actions[x])+'</button>').join('');document.getElementById('free-play').innerHTML=Object.entries(actions).map(([k,v])=>'<button '+(k==='forget'?'class="danger"':'')+' data-action="'+k+'">'+escape(v)+'</button>').join('')}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined){scenarioIndex=Number(b.dataset.tab);stepIndex=0;state=initialState()}else if(b.dataset.step!==undefined){if(Number(b.dataset.step)!==stepIndex)return;state=reduce(state,scenarios[scenarioIndex].steps[stepIndex++])}else if(b.dataset.action){state=reduce(state,b.dataset.action)}render()});render();
  </script>
</body>
</html>
