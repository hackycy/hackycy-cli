<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nodes 流程草模 · Tunnel Node</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #183036; background: #f4f7f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button { border: 1px solid #a8c0c1; background: #fff; border-radius: 7px; padding: 7px 11px; color: #17383c; cursor: pointer; }
    button:hover:not(:disabled) { border-color: #157b7e; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.primary { color: white; background: #08797d; border-color: #08797d; }
    button.danger { color: #a82a36; border-color: #deaeb3; }
    button.active { color: white; background: #244b50; border-color: #244b50; }
    input, select { border: 1px solid #a8c0c1; border-radius: 6px; padding: 7px 9px; background: white; width: 100%; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 10px; }
    label input, label select { display: block; margin-top: 4px; font-weight: 400; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 24px; margin-bottom: 6px; }
    h2 { font-size: 18px; margin-bottom: 12px; }
    h3 { font-size: 15px; margin-bottom: 8px; }
    p { margin-bottom: 12px; }
    small, .muted { color: #627779; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
    aside { background: #17363a; color: #e8f1f1; padding: 24px 14px; }
    aside .brand { font-size: 13px; font-weight: 800; letter-spacing: .11em; margin: 0 9px 25px; }
    aside button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: #d1e3e2; margin: 3px 0; }
    aside button.active { background: #29565b; color: white; }
    main { max-width: 1260px; padding: 25px 30px 55px; width: 100%; }
    .intro { background: #e8f3f1; border: 1px solid #c6dedd; border-radius: 10px; padding: 16px 18px; margin-bottom: 20px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #056a6d; background: #d2eae6; border-radius: 4px; padding: 2px 6px; margin-bottom: 5px; }
    .toolbar, .button-row, .scenario-tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar { justify-content: space-between; margin-bottom: 16px; }
    .role { display: flex; align-items: center; gap: 8px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
    .panel, .node-card { background: white; border: 1px solid #d5e1e1; border-radius: 10px; padding: 17px; }
    .panel { margin-bottom: 16px; }
    .node-card { margin-bottom: 10px; }
    .node-card.selected { border-color: #0c8285; box-shadow: 0 0 0 2px #d6eeea inset; }
    .node-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .node-head h3 { margin: 0; }
    .badge { display: inline-block; font-size: 12px; border-radius: 999px; padding: 2px 8px; background: #e8eeee; white-space: nowrap; }
    .badge.good { color: #08674d; background: #d9f1e6; }
    .badge.warn { color: #895a06; background: #fcf0d4; }
    .badge.bad { color: #a82a36; background: #f8e2e3; }
    .kv { display: grid; grid-template-columns: 145px 1fr; gap: 5px 12px; margin: 0; }
    .kv dt { color: #637678; }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .note { border-left: 3px solid #79979a; background: #f3f7f7; padding: 9px 12px; margin: 10px 0; }
    .note.warn { border-color: #c68526; background: #fff7e7; }
    .note.bad { border-color: #c5525a; background: #fff1f1; }
    .notice { border-radius: 8px; padding: 11px 14px; margin-bottom: 16px; background: #eef4f4; border: 1px solid #d4e3e3; }
    .notice.bad { background: #fff1f1; border-color: #edc3c6; }
    .notice.good { background: #e9f6ef; border-color: #c9e7d6; }
    .stack > * + * { margin-top: 10px; }
    .divider { border-top: 1px solid #e1e9e9; margin: 16px 0; }
    .scenario { background: white; border: 1px solid #d5e1e1; border-radius: 10px; padding: 15px; margin-bottom: 16px; }
    .scenario-tabs { margin-bottom: 11px; }
    .scenario-tabs button { font-size: 13px; }
    .steps { display: flex; flex-wrap: wrap; gap: 7px; }
    .step-done { color: #6c8788; text-decoration: line-through; }
    .scope { font-size: 12px; color: #526d70; padding: 7px 10px; background: #eef3f3; border-radius: 6px; }
    @media (max-width: 850px) { .layout { display: block; } aside { display: flex; gap: 8px; align-items: center; padding: 10px; } aside .brand { margin: 0 8px 0 0; } aside button { width: auto; margin: 0; } main { padding: 16px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 纯状态模型；下面的 DOM 代码只负责展示与派发动作。此文件是可丢弃的设计草模。
    function initialState() {
      return {
        role: 'admin', page: 'nodes', selectedNode: 'hk', confirmForgetId: null,
        nodes: [
          { id: 'local', name: 'Main Server', type: 'local', management: '本机内置', frp: 'tunnel.example.com:7000', http: 'tunnel.example.com:8080', reachable: true, frps: 'running', desired: 4, applied: 4, removal: 'none', error: '', fingerprint: '', observed: '刚刚' },
          { id: 'hk', name: 'Hong Kong 01', type: 'remote', management: 'http://203.0.113.10:7600', frp: 'hk.example.com:7000', http: 'hk.example.com:8080', reachable: true, frps: 'running', desired: 17, applied: 17, removal: 'none', error: '', fingerprint: '7C:1E:92:6A:…:4B', observed: '刚刚' },
          { id: 'la', name: 'Los Angeles 01', type: 'remote', management: 'http://198.51.100.20:7600', frp: 'la.example.com:7000', http: 'la.example.com:8080', reachable: false, frps: 'running', desired: 8, applied: 8, removal: 'none', error: '', fingerprint: '2D:91:0F:63:…:A8', observed: '12 分钟前' },
        ],
        client: { name: 'Office Mac', owner: 'alice', assigned: 'local', pending: null, control: 'online', appliedNode: 'local', frpc: 'connected' },
        claim: { name: 'Tokyo 01', address: 'http://192.0.2.30:7600', outcome: 'ok', preview: null, entered: '' },
        notice: { kind: 'info', text: '点击上方场景步骤，或直接使用页面操作。所有数据只在当前页面内模拟。' },
      };
    }

    const demoFingerprint = 'A1:32:7E:94:…:0C';
    function nodeById(state, id) { return state.nodes.find(node => node.id === id); }
    function ready(node) { return node && node.reachable && node.frps === 'running' && node.removal === 'none'; }
    function announce(state, kind, text) { state.notice = { kind, text }; return state; }
    function commitSwitch(state, id) {
      state.client.assigned = id;
      state.client.pending = null;
      state.client.frpc = 'awaiting-client';
      return announce(state, 'good', '归属已切换到 ' + nodeById(state, id).name + '；官方 Client 尚未报告新 FRPC 已连接，旧连接停止情况仍待观察。');
    }
    function reduce(previous, action) {
      const state = JSON.parse(JSON.stringify(previous));
      const target = nodeById(state, action.id || state.selectedNode);
      switch (action.type) {
        case 'role': state.role = action.value; return announce(state, 'info', action.value === 'admin' ? '管理员视图：可认领和管理 Node，也可操作所有 Client。' : '普通用户视图：能看全部 Node 并切换自己的 Client；管理地址和指纹已隐藏。');
        case 'page': state.page = action.value; return state;
        case 'select-node': state.selectedNode = action.id; return state;
        case 'claim-field': state.claim[action.field] = action.value; if (action.field === 'address') state.claim.preview = null; return state;
        case 'preview-claim': {
          if (state.role !== 'admin') return announce(state, 'bad', '只有管理员能认领 Node。');
          if (state.claim.outcome === 'unreachable') return announce(state, 'bad', 'NODE_UNREACHABLE：无法连接管理地址；检查 Node 进程、IP、端口和网络。');
          if (state.claim.outcome === 'protocol') return announce(state, 'bad', 'NODE_PROTOCOL_INCOMPATIBLE：Server 与 Node 管理协议版本不匹配，请部署同一发行版。');
          state.claim.preview = demoFingerprint;
          return announce(state, 'info', '已取得 Node 身份指纹。请与 Node 本机输出逐字核对，再确认认领。仅预览不会占用认领权。');
        }
        case 'confirm-claim': {
          if (state.role !== 'admin') return announce(state, 'bad', '只有管理员能认领 Node。');
          if (!state.claim.preview) return announce(state, 'bad', '请先预览并核对 Node 指纹。');
          if (state.claim.entered.trim().toUpperCase() !== state.claim.preview.toUpperCase()) return announce(state, 'bad', 'NODE_IDENTITY_MISMATCH：指纹不符；没有发送认领请求。请核对 Node 本机显示的指纹。');
          if (state.claim.outcome === 'claimed') return announce(state, 'bad', 'NODE_ALREADY_CLAIMED：该 Node 已被认领。不会显示原 Controller 身份；若确属本 Server，请用原身份显式重新添加。');
          if (state.nodes.some(node => node.management === state.claim.address)) return announce(state, 'bad', '该管理地址已在 Node 列表中。');
          const name = state.claim.name.trim() || 'New Node';
          const id = 'new-' + state.nodes.length;
          state.nodes.push({ id, name, type: 'remote', management: state.claim.address, frp: '待管理员设置', http: '待管理员设置', reachable: true, frps: 'stopped', desired: 0, applied: 0, removal: 'none', error: '', fingerprint: state.claim.preview, observed: '刚刚' });
          state.selectedNode = id;
          state.claim.preview = null;
          return announce(state, 'good', name + ' 认领成功。Node 已绑定当前 Server；请设置对外 FRP 地址与期望配置，应用成功后才能分配 Client。');
        }
        case 'switch': {
          if (!target) return announce(state, 'bad', 'Node 不存在。');
          if (!ready(target)) return announce(state, 'bad', 'NODE_TARGET_UNAVAILABLE：目标 Node 当前不可用，Client 继续留在原 Node。');
          if (state.client.assigned === target.id && !state.client.pending) return announce(state, 'info', 'Client 已归属此 Node。');
          if (state.client.control === 'offline') {
            state.client.pending = target.id;
            return announce(state, 'info', '已保存待切换目标；Client 控制连接离线，当前归属与旧 FRPC 暂时不变。');
          }
          return commitSwitch(state, target.id);
        }
        case 'cancel-pending': state.client.pending = null; return announce(state, 'info', '已取消待切换；当前归属未改变。');
        case 'control-offline': state.client.control = 'offline'; return announce(state, 'info', 'Client 控制连接离线；正在运行的 FRPC 可能继续使用旧 Node。');
        case 'control-online': {
          state.client.control = 'online';
          if (state.client.pending) {
            const pending = nodeById(state, state.client.pending);
            if (ready(pending)) return commitSwitch(state, pending.id);
            return announce(state, 'bad', 'Client 已重连，但待切换 Node 不可用；保持待切换，当前归属不变。');
          }
          return announce(state, 'info', 'Client 控制连接已恢复，主 Server 会下发当前归属的完整配置。');
        }
        case 'client-frpc-success': state.client.appliedNode = state.client.assigned; state.client.frpc = 'connected'; return announce(state, 'good', '官方 Client 已连接当前归属 Node 的 FRPS。');
        case 'client-frpc-fail': state.client.appliedNode = state.client.assigned; state.client.frpc = 'failed'; return announce(state, 'bad', '归属仍在新 Node；FRPC 首次连接失败，不自动回旧 Node。请检查 Client 到 Node 的网络。');
        case 'node-offline': if (!target || target.type === 'local') return state; target.reachable = false; target.observed = '12 分钟前'; return announce(state, 'bad', target.name + ' 管理连接离线。上次 FRPS 报告仅供参考，当前是否运行未知。');
        case 'node-online': if (!target) return state; target.reachable = true; target.observed = '刚刚'; return announce(state, 'good', target.name + ' 管理连接恢复，正在查询真实配置和 FRPS 状态。');
        case 'config-fail': if (!target || target.type === 'local') return state; target.desired++; target.error = '新配置验证失败；已保留上次可用配置'; return announce(state, 'bad', 'NODE_CONFIG_REJECTED：新版本未应用，已应用版本和旧 FRPS 保持不变。');
        case 'activate-new-node': if (!target || target.type === 'local') return state; target.frp = 'tokyo.example.com:7000'; target.http = 'tokyo.example.com:8080'; target.frps = 'running'; target.desired = 1; target.applied = 1; return announce(state, 'good', '已设置对外 FRP / HTTP 地址，并模拟 Node 应用完整配置。现在可以分配 Client。');
        case 'remove': {
          if (state.role !== 'admin' || !target || target.type === 'local') return announce(state, 'bad', '只有管理员能移除远端 Node；本地 Node 不可移除。');
          if (state.client.assigned === target.id || state.client.pending === target.id) return announce(state, 'bad', 'NODE_HAS_CLIENTS：请先把当前或待切换的 Client 移走，再移除 Node。');
          target.removal = 'pending';
          return announce(state, 'info', target.reachable ? '已下发持久停用；等待 Node 确认 FRPS 停止并清除旧运行凭据。' : 'Node 离线，保持待移除；旧 FRPS 可能仍在运行。');
        }
        case 'stop-confirmed': {
          if (!target || target.removal !== 'pending' || !target.reachable) return announce(state, 'bad', '尚不能确认远端已持久停用；Node 离线时不能完成正常移除。');
          state.nodes = state.nodes.filter(node => node.id !== target.id);
          state.selectedNode = 'local';
          return announce(state, 'good', 'Node 已确认持久停用并从活动清单移除；它仍绑定原 Controller，不会开放新的认领。');
        }
        case 'request-force-forget': {
          if (state.role !== 'admin' || !target || target.type === 'local') return announce(state, 'bad', '只有管理员能强制遗忘远端 Node。');
          if (state.client.assigned === target.id || state.client.pending === target.id) return announce(state, 'bad', 'NODE_HAS_CLIENTS：请先清理当前和待切换 Client。');
          if (target.reachable && target.removal !== 'pending') return announce(state, 'bad', 'Node 可连接时请先正常移除，等待持久停用确认。');
          state.confirmForgetId = target.id;
          return announce(state, 'bad', '请再次确认：强制遗忘只删除 Server 记录，远端 FRPS 可能仍运行。');
        }
        case 'cancel-force-forget': state.confirmForgetId = null; return announce(state, 'info', '已取消强制遗忘。');
        case 'force-forget': {
          if (state.role !== 'admin' || !target || target.id !== state.confirmForgetId) return announce(state, 'bad', '请先确认强制遗忘风险。');
          state.nodes = state.nodes.filter(node => node.id !== target.id);
          state.confirmForgetId = null;
          state.selectedNode = 'local';
          return announce(state, 'bad', '已强制遗忘 Server 记录；无法证明远端 FRPS 已停止，Node 本机仍绑定原 Controller。');
        }
        default: return state;
      }
    }

    const scenarios = [
      { name: '认领新 Node', description: '预览指纹、在本机核对后认领。只认领不代表 FRPS 已可用。', steps: [
        ['预览 Node 指纹', { type: 'preview-claim' }], ['填入与 Node 本机相同的指纹', { type: 'claim-field', field: 'entered', value: demoFingerprint }], ['确认认领', { type: 'confirm-claim' }], ['模拟配置并启动 FRPS', { type: 'activate-new-node' }],
      ] },
      { name: '认领失败', description: '分别试试“已被认领”“不可达”“协议不兼容”和错误指纹；失败原因与处理建议应清楚。', steps: [
        ['模拟已被其他 Server 认领', { type: 'claim-field', field: 'outcome', value: 'claimed' }], ['预览指纹', { type: 'preview-claim' }], ['填入正确指纹', { type: 'claim-field', field: 'entered', value: demoFingerprint }], ['尝试认领', { type: 'confirm-claim' }],
      ] },
      { name: '在线切换失败', description: '目标 Node 健康时立即提交新归属；Client 到 FRPS 失败也不会自动退回。', steps: [
        ['打开 Client', { type: 'page', value: 'client' }], ['选择 Hong Kong 01', { type: 'switch', id: 'hk' }], ['模拟新 FRPC 连接失败', { type: 'client-frpc-fail' }],
      ] },
      { name: '离线待切换', description: 'Client 离线时只保存目标；重连且目标可用后才正式切换。', steps: [
        ['打开 Client', { type: 'page', value: 'client' }], ['模拟 Client 离线', { type: 'control-offline' }], ['选择 Hong Kong 01', { type: 'switch', id: 'hk' }], ['模拟 Client 重连', { type: 'control-online' }], ['模拟 FRPC 登录成功', { type: 'client-frpc-success' }],
      ] },
      { name: '配置失败', description: '新配置失败后仍保留上次可用配置，版本和 FRPS 运行状态分别展示。', steps: [
        ['选中 Hong Kong 01', { type: 'select-node', id: 'hk' }], ['模拟新配置验证失败', { type: 'config-fail', id: 'hk' }],
      ] },
      { name: '正常移除', description: '主 Server 先请求持久停用，收到 Node 确认后才从活动列表移除。', steps: [
        ['请求移除 Hong Kong 01', { type: 'remove', id: 'hk' }], ['模拟远端持久停用确认', { type: 'stop-confirmed', id: 'hk' }],
      ] },
      { name: '离线强制遗忘', description: 'Node 离线时正常移除只会待处理；强制遗忘需要单独确认，且无法证明远端已停止。', steps: [
        ['使 Hong Kong 01 离线', { type: 'node-offline', id: 'hk' }], ['请求正常移除', { type: 'remove', id: 'hk' }], ['选择强制遗忘', { type: 'request-force-forget', id: 'hk' }], ['确认风险并遗忘', { type: 'force-forget', id: 'hk' }],
      ] },
    ];

    let state = initialState();
    let scenarioIndex = 0;
    let scenarioStep = 0;
    const app = document.getElementById('app');
    function esc(value) { return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]); }
    function nodeLabel(node) { return node ? esc(node.name) : '—'; }
    function availability(node) {
      if (node.removal === 'pending') return ['待移除', 'warn'];
      if (!node.reachable) return ['管理离线', 'bad'];
      if (node.frps !== 'running') return ['FRPS 未运行', 'warn'];
      if (node.error) return ['配置未收敛', 'warn'];
      return ['可用', 'good'];
    }
    function renderNodeCard(node) {
      const [label, tone] = availability(node);
      return '<article class="node-card ' + (state.selectedNode === node.id ? 'selected' : '') + '">' +
        '<div class="node-head"><h3>' + esc(node.name) + ' <small>· ' + (node.type === 'local' ? '本地' : '远端') + '</small></h3><span class="badge ' + tone + '">' + label + '</span></div>' +
        '<p style="margin:8px 0 9px"><small>FRP 对外地址</small> <span class="mono">' + esc(node.frp) + '</span><br><small>HTTP 公网入口</small> <span class="mono">' + esc(node.http) + '</span></p>' +
        '<button data-do="select-node" data-id="' + esc(node.id) + '">查看' + (state.role === 'admin' ? '管理详情' : '公开状态') + '</button></article>';
    }
    function renderNodeDetail(node) {
      if (!node) return '<section class="panel">请选择 Node。</section>';
      const [label, tone] = availability(node);
      const offline = !node.reachable ? '<div class="note warn">管理连接离线；FRPS “' + esc(node.frps) + '”仅是' + esc(node.observed) + '的上次报告，当前状态未知。</div>' : '';
      return '<section class="panel"><h2>' + esc(node.name) + '</h2><dl class="kv">' +
        '<dt>可用性</dt><dd><span class="badge ' + tone + '">' + label + '</span></dd>' +
        '<dt>FRP 对外地址</dt><dd class="mono">' + esc(node.frp) + '</dd>' +
        '<dt>HTTP 公网入口</dt><dd class="mono">' + esc(node.http) + '</dd>' +
        '<dt>FRPS 状态</dt><dd>' + (node.reachable ? esc(node.frps) : '当前未知') + ' · 观察于' + esc(node.observed) + '</dd>' +
        '</dl>' + offline +
        (state.role !== 'admin' ? '<div class="note">管理地址、身份指纹、详细错误和凭据仅管理员可见。</div>' :
          '<div class="divider"></div><h3>管理员详情</h3><dl class="kv"><dt>管理地址</dt><dd class="mono">' + esc(node.management) + '</dd><dt>Node 指纹</dt><dd class="mono">' + esc(node.fingerprint || '本地 Node 无远端指纹') + '</dd><dt>期望 / 已应用版本</dt><dd>' + node.desired + ' / ' + node.applied + '</dd><dt>最近错误</dt><dd>' + esc(node.error || '无') + '</dd></dl>' +
          (node.type === 'remote' ? '<div class="divider"></div>' + (node.frp === '待管理员设置' ? '<div class="note warn">仅认领成功；还需配置 FRPS 和公网地址。</div><button class="primary" data-do="activate-new-node" data-id="' + esc(node.id) + '">模拟配置并启动 FRPS</button><div class="divider"></div>' : '') + '<div class="button-row"><button data-do="node-offline" data-id="' + esc(node.id) + '">模拟离线</button><button data-do="node-online" data-id="' + esc(node.id) + '">模拟恢复</button><button data-do="config-fail" data-id="' + esc(node.id) + '">模拟配置失败</button><button data-do="remove" data-id="' + esc(node.id) + '">正常移除</button><button data-do="stop-confirmed" data-id="' + esc(node.id) + '">模拟停用确认</button><button class="danger" data-do="request-force-forget" data-id="' + esc(node.id) + '">强制遗忘…</button></div>' + (state.confirmForgetId === node.id ? '<div class="note bad"><strong>确认强制遗忘？</strong><br>这只会删除主 Server 记录；远端 FRPS 可能仍在运行，旧凭据可能仍有效。Node 本机也不会解绑。<div class="button-row" style="margin-top:8px"><button data-do="cancel-force-forget">取消</button><button class="danger" data-do="force-forget" data-id="' + esc(node.id) + '">确认遗忘</button></div></div>' : '') + '<div class="note warn">这里没有“改绑”或 Node reset。</div>' : '<div class="note">本地 Node 随主 Server 存在，不能移除；设置仍由 Server 启动配置管理。</div>')) +
        '</section>';
    }
    function renderClaim() {
      if (state.role !== 'admin') return '';
      const claim = state.claim;
      return '<section class="panel"><h2>添加远端 Node</h2><p class="muted">主 Server 主动访问公网 HTTP 管理地址；Node 本机无需配置 Server 地址，也没有配对码。</p><div class="note warn">未认领的公网 Node 自动信任第一个有效认领者。请及时核对本机指纹并认领。</div>' +
        '<label>Node 名称<input data-field="name" value="' + esc(claim.name) + '"></label>' +
        '<label>管理地址（仅管理员可见）<input data-field="address" value="' + esc(claim.address) + '"></label>' +
        '<label>预览结果模拟<select data-field="outcome"><option value="ok" ' + (claim.outcome === 'ok' ? 'selected' : '') + '>正常</option><option value="claimed" ' + (claim.outcome === 'claimed' ? 'selected' : '') + '>已被认领</option><option value="unreachable" ' + (claim.outcome === 'unreachable' ? 'selected' : '') + '>不可达</option><option value="protocol" ' + (claim.outcome === 'protocol' ? 'selected' : '') + '>协议不兼容</option></select></label>' +
        '<button data-do="preview-claim">1. 预览身份</button>' +
        (claim.preview ? '<div class="note"><strong>Node 指纹：</strong><span class="mono">' + esc(claim.preview) + '</span><br><small>先与 Node 本机启动输出核对。预览并不占用认领权。</small></div><label>输入 Node 本机显示的完整指纹<input data-field="entered" value="' + esc(claim.entered) + '" placeholder="逐字核对后填写"></label><button class="primary" data-do="confirm-claim">2. 确认认领</button>' : '') +
        '</section>';
    }
    function renderClient() {
      const client = state.client;
      const assigned = nodeById(state, client.assigned);
      const pending = nodeById(state, client.pending);
      return '<div class="grid"><div><section class="panel"><h2>' + esc(client.name) + '</h2><p class="scope">' + (state.role === 'admin' ? '管理员可操作全部 Client' : '普通用户只能操作自己拥有的 Client') + ' · 此演示 Client 属于 ' + esc(client.owner) + '</p>' +
        '<dl class="kv"><dt>当前归属</dt><dd>' + nodeLabel(assigned) + '</dd><dt>待切换目标</dt><dd>' + nodeLabel(pending) + '</dd><dt>控制连接</dt><dd>' + (client.control === 'online' ? '在线' : '离线') + '</dd><dt>Client 已应用 Node</dt><dd>' + nodeLabel(nodeById(state, client.appliedNode)) + '</dd><dt>FRPC 到 Node</dt><dd>' + ({ connected: '已连接', failed: '连接失败', 'awaiting-client': '等待 Client 应用' })[client.frpc] + '</dd></dl>' +
        (client.pending ? '<div class="note warn">目前仍归属 ' + nodeLabel(assigned) + '；待 Client 重连且目标可用后才正式切换。<div class="button-row" style="margin-top:8px"><button data-do="cancel-pending">取消待切换</button></div></div>' : '') +
        (client.frpc === 'failed' ? '<div class="note bad">新 Node 已成为正式归属；FRPC 连接失败，等待修复或用户再次明确切换，不自动回旧 Node。</div>' : '') +
        '<div class="divider"></div><h3>模拟 Client 观察</h3><div class="button-row"><button data-do="control-offline">控制连接离线</button><button data-do="control-online">控制连接重连</button><button data-do="client-frpc-success">FRPC 登录成功</button><button data-do="client-frpc-fail">FRPC 登录失败</button></div></section></div>' +
        '<div><section class="panel"><h2>选择 Node</h2><p class="muted">所有登录用户都能看到并选择全部 Node；当前不可用的 Node 不能提交新切换。</p>' +
        state.nodes.map(node => { const [label, tone] = availability(node); return '<div class="node-card"><div class="node-head"><strong>' + esc(node.name) + '</strong><span class="badge ' + tone + '">' + label + '</span></div><small>FRP ' + esc(node.frp) + '</small><div style="margin-top:7px"><button data-do="switch" data-id="' + esc(node.id) + '" ' + (!ready(node) ? 'disabled' : '') + '>切换到此 Node</button></div></div>'; }).join('') + '</section></div></div>';
    }
    function renderScenario() {
      const chosen = scenarios[scenarioIndex];
      return '<section class="scenario"><h3>按场景体验</h3><div class="scenario-tabs">' + scenarios.map((scenario, index) => '<button class="' + (index === scenarioIndex ? 'active' : '') + '" data-scenario="' + index + '">' + esc(scenario.name) + '</button>').join('') + '</div><p class="muted">' + esc(chosen.description) + '</p><div class="steps">' + chosen.steps.map((step, index) => '<button class="' + (index < scenarioStep ? 'step-done' : index === scenarioStep ? 'primary' : '') + '" data-step="' + index + '">' + (index + 1) + '. ' + esc(step[0]) + '</button>').join('') + '</div><p style="margin:10px 0 0"><small>切换场景会恢复初始状态；也可直接操作下方页面自由探索。</small></p></section>';
    }
    function render() {
      const chosen = nodeById(state, state.selectedNode);
      app.innerHTML = '<div class="layout"><aside><div class="brand">HACKYCY TUNNEL</div><button data-do="page" data-value="nodes" class="' + (state.page === 'nodes' ? 'active' : '') + '">Nodes</button><button data-do="page" data-value="client" class="' + (state.page === 'client' ? 'active' : '') + '">Client details</button></aside><main>' +
        '<div class="intro"><span class="tag">可丢弃设计草模 · 不连接真实服务</span><h1>Nodes 页面与切换流程</h1><p>要验证的问题：用户能否分清 Node 的归属、管理连通性、FRPS 运行与 Client 的实际连接？认领失败、切换失败和移除时，下一步是否明确？</p><small>本文件只有内存中的示例数据；刷新即可重置。Node 指纹、IP 和域名均为演示值。</small></div>' +
        renderScenario() + '<div class="toolbar"><div><h2 style="margin:0">' + (state.page === 'nodes' ? 'Nodes' : 'Client details') + '</h2><small>' + (state.page === 'nodes' ? '所有登录用户可见的 Node 列表' : 'Office Mac · 当前归属 ' + nodeLabel(nodeById(state, state.client.assigned))) + '</small></div><div class="role"><small>查看身份</small><button data-do="role" data-value="admin" class="' + (state.role === 'admin' ? 'active' : '') + '">管理员</button><button data-do="role" data-value="user" class="' + (state.role === 'user' ? 'active' : '') + '">普通用户</button></div></div>' +
        '<div class="notice ' + esc(state.notice.kind) + '">' + esc(state.notice.text) + '</div>' +
        (state.page === 'nodes' ? '<div class="grid"><div><section class="panel"><h2>Node 列表</h2>' + state.nodes.map(renderNodeCard).join('') + '</section>' + renderClaim() + '</div><div>' + renderNodeDetail(chosen) + '</div></div>' : renderClient()) +
        '</main></div>';
    }
    function dispatch(action) { state = reduce(state, action); render(); }
    document.addEventListener('click', event => {
      const scenarioButton = event.target.closest('[data-scenario]');
      if (scenarioButton) { scenarioIndex = Number(scenarioButton.dataset.scenario); scenarioStep = 0; state = initialState(); render(); return; }
      const stepButton = event.target.closest('[data-step]');
      if (stepButton) { const index = Number(stepButton.dataset.step); dispatch(scenarios[scenarioIndex].steps[index][1]); scenarioStep = Math.max(scenarioStep, index + 1); render(); return; }
      const button = event.target.closest('[data-do]');
      if (!button) return;
      dispatch({ type: button.dataset.do, id: button.dataset.id, value: button.dataset.value });
    });
    document.addEventListener('change', event => {
      const field = event.target.closest('[data-field]');
      if (field) dispatch({ type: 'claim-field', field: field.dataset.field, value: field.value });
    });
    render();
  </script>
</body>
</html>
